services:
  devws:
    build:
      context: .
      dockerfile: Dockerfile
    image: devws-polyglot:latest
    container_name: master_dev_workspace
    volumes:
      - devws_projects:/projects
      - devws_home:/home/vscode
      - /var/run/docker.sock:/var/run/docker.sock
      - ${HOME}/.ssh:/home/vscode/.ssh:ro
    environment:
      OLLAMA_HOST: http://host.docker.internal:11434
      ANTHROPIC_BASE_URL: http://host.docker.internal:11434/v1
      ANTHROPIC_API_KEY: ollama
      OPENAI_BASE_URL: http://host.docker.internal:11434/v1
      OPENAI_API_KEY: ollama
      PNPM_HOME: /home/vscode/.local/share/pnpm
      NPM_CONFIG_STORE_DIR: /home/vscode/.local/share/pnpm/store
      PNPM_STORE_DIR: /home/vscode/.local/share/pnpm/store
      UV_CACHE_DIR: /home/vscode/.cache/uv
      GOPATH: /home/vscode/go
      GOCACHE: /home/vscode/.cache/go-build
      PUB_CACHE: /home/vscode/.pub-cache
    ports:
      - "3000:3000"
      - "5173:5173"
      - "8000:8000"
      - "8080:8080"
      - "8081:8081"
      - "9000:9000"
    command: /bin/sh -c "while sleep 1000; do :; done"

  preview-sidecar:
    image: nginx:alpine
    container_name: master_dev_preview_sidecar
    restart: unless-stopped
    volumes:
      - devws_projects:/usr/share/nginx/html:ro
    ports:
      - "8383:80"
    command: >
      /bin/sh -c 'printf "server {\n    listen 80;\n    root /usr/share/nginx/html;\n    autoindex on;\n    autoindex_exact_size off;\n    autoindex_localtime on;\n    charset utf-8;\n    add_header Cache-Control \"no-cache, no-store, must-revalidate\";\n}\n" > /etc/nginx/conf.d/default.conf && exec nginx -g "daemon off;"'

volumes:
  devws_projects:
    name: devws_projects
  devws_home:
    name: devws_home
